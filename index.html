<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Booklet 2026 – Flipbook</title>
  <meta name="description" content="Online flipbook viewer">
  <meta property="og:title" content="Booklet 2026 – Flipbook">
  <meta property="og:image" content="assets/thumb.jpg">
  <link rel="icon" href="assets/thumb.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="viewport">
    <div id="stage">
      <div id="book" aria-label="Flipbook"></div>
    </div>
    <div id="pan-layer" hidden></div>

    <button id="prev" class="arrow arrow-prev" aria-label="Previous page" hidden>
      <svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5" /></svg>
    </button>
    <button id="next" class="arrow arrow-next" aria-label="Next page">
      <svg viewBox="0 0 24 24"><path d="M8.5 4.5 16 12l-7.5 7.5" /></svg>
    </button>
  </main>

  <aside id="outline" aria-label="Outline" hidden>
    <header><span>Outline</span><button id="outline-close" aria-label="Close outline">&times;</button></header>
    <ul id="outline-list"></ul>
  </aside>

  <nav id="toolbar">
    <button id="btn-outline" title="Outline" aria-label="Outline">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
    </button>
    <button id="btn-zoom" title="Zoom" aria-label="Zoom">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" /><path d="m15 15 5 5M10.5 8v5M8 10.5h5" /></svg>
    </button>
    <span id="page-indicator" aria-live="polite">1 / 1</span>
    <button id="btn-sound" title="Flip sound" aria-label="Flip sound" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z" /><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /><path class="mute" d="m15 9.5 5 5m0-5-5 5" /></svg>
    </button>
    <button id="btn-fullscreen" title="Fullscreen" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
    </button>
  </nav>

  <script src="js/vendor/page-flip.browser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
